<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Secure Alarm - スマートフォン盗難防止アプリ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Secure Alarm">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Secure Alarm</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin:0; padding:0; background-color:#4A148C; overflow:hidden; }
    #loading {
      display:flex; justify-content:center; align-items:center;
      height:100vh; flex-direction:column; color:white; font-family:sans-serif;
    }
    .spinner {
      width:48px; height:48px;
      border:5px solid rgba(255,255,255,0.3);
      border-top-color:white; border-radius:50%;
      animation:spin 0.8s linear infinite; margin-bottom:16px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Secure Alarm 読み込み中...</p>
  </div>

  <script>
  // ============================================================
  //  Secure Alarm - Web Engine v4
  //  1) saPlay(type, vol) / saStop()          … 音声
  //  2) saRequestMotion()                      … DeviceMotion許可
  //  3) saGetMotion()                          … 最新モーション [x,y,z,ts]
  //  4) saGetMouseDelta()                      … マウス移動量（PCフォールバック）
  // ============================================================
  (function() {
    'use strict';

    // ── 音声エンジン ──────────────────────────────────────────
    var _audioCtx = null;
    var _activeNodes = [];

    function _getCtx() {
      if (!_audioCtx || _audioCtx.state === 'closed') {
        try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { return null; }
      }
      if (_audioCtx.state === 'suspended') { _audioCtx.resume(); }
      return _audioCtx;
    }

    function _stopAllNodes() {
      _activeNodes.forEach(function(n) {
        try { n.stop(0); } catch(e) {}
        try { n.disconnect(); } catch(e) {}
      });
      _activeNodes = [];
    }

    function _playSiren(vol) {
      var ctx = _getCtx(); if (!ctx) return;
      var now = ctx.currentTime;
      var g = ctx.createGain(); g.gain.setValueAtTime(vol*0.8, now); g.connect(ctx.destination);
      var o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(440, now);
      o.frequency.linearRampToValueAtTime(880, now+0.6);
      o.frequency.linearRampToValueAtTime(440, now+1.2);
      o.frequency.linearRampToValueAtTime(880, now+1.8);
      o.connect(g); o.start(now); o.stop(now+1.8); _activeNodes.push(o);
    }
    function _playBeeps(vol) {
      var ctx = _getCtx(); if (!ctx) return;
      var now = ctx.currentTime;
      for (var i=0; i<5; i++) {
        var t = now+i*0.22;
        var g = ctx.createGain();
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.linearRampToValueAtTime(0,t+0.14);
        g.connect(ctx.destination);
        var o = ctx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(1200,t);
        o.connect(g); o.start(t); o.stop(t+0.16); _activeNodes.push(o);
      }
    }
    function _playBuzzer(vol) {
      var ctx = _getCtx(); if (!ctx) return;
      var now = ctx.currentTime;
      [[0,0.28],[0.4,0.68],[0.8,1.08]].forEach(function(p) {
        var g = ctx.createGain(); g.gain.setValueAtTime(vol*0.9,now+p[0]); g.gain.setValueAtTime(0,now+p[1]); g.connect(ctx.destination);
        var o = ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(220,now+p[0]);
        o.connect(g); o.start(now+p[0]); o.stop(now+p[1]+0.01); _activeNodes.push(o);
      });
    }
    function _playHighAlarm(vol) {
      var ctx = _getCtx(); if (!ctx) return;
      var now = ctx.currentTime;
      [2400,3200].forEach(function(f) {
        var g = ctx.createGain(); g.gain.setValueAtTime(vol*0.55,now); g.gain.exponentialRampToValueAtTime(0.001,now+1.4); g.connect(ctx.destination);
        var o = ctx.createOscillator(); o.type='sine';
        o.frequency.setValueAtTime(f,now); o.frequency.linearRampToValueAtTime(f*1.6,now+0.7); o.frequency.linearRampToValueAtTime(f,now+1.4);
        o.connect(g); o.start(now); o.stop(now+1.4); _activeNodes.push(o);
      });
    }
    function _playExplosive(vol) {
      var ctx = _getCtx(); if (!ctx) return;
      var now = ctx.currentTime;
      var bg = ctx.createGain(); bg.gain.setValueAtTime(vol*0.7,now); bg.gain.exponentialRampToValueAtTime(0.001,now+0.45); bg.connect(ctx.destination);
      var bo = ctx.createOscillator(); bo.type='square'; bo.frequency.setValueAtTime(120,now);
      bo.connect(bg); bo.start(now); bo.stop(now+0.46); _activeNodes.push(bo);
      [880,1760,2640].forEach(function(f,i) {
        var t = now+i*0.18;
        var g = ctx.createGain(); g.gain.setValueAtTime(vol*0.55,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3); g.connect(ctx.destination);
        var o = ctx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(f,t);
        o.connect(g); o.start(t); o.stop(t+0.32); _activeNodes.push(o);
      });
    }

    window.saPlay = function(soundType, volume) {
      _stopAllNodes();
      var vol = Math.min(1.0, Math.max(0.05, parseFloat(volume)||0.7));
      var type = parseInt(soundType)||0;
      console.log('[SA] saPlay type='+type+' vol='+vol.toFixed(2));
      switch(type) {
        case 0: _playSiren(vol); break;
        case 1: _playBeeps(vol); break;
        case 2: _playBuzzer(vol); break;
        case 3: _playHighAlarm(vol); break;
        case 4: _playExplosive(vol); break;
        default: _playSiren(vol);
      }
    };
    window.saStop = function() { _stopAllNodes(); console.log('[SA] saStop'); };

    // ── モーションセンサーエンジン ───────────────────────────
    var _latestMotion = null;   // [ax, ay, az, timestamp]
    var _motionListening = false;

    function _onDeviceMotion(e) {
      var a = e.accelerationIncludingGravity || e.acceleration;
      if (!a) return;
      _latestMotion = [
        a.x || 0,
        a.y || 0,
        a.z || 0,
        Date.now()
      ];
    }

    // DeviceMotionを要求する。対応なら true、非対応なら false を返す
    window.saRequestMotion = function() {
      // DeviceMotionEvent 自体がなければ非対応
      if (typeof DeviceMotionEvent === 'undefined') {
        console.log('[SA] DeviceMotionEvent not supported → mouse fallback');
        return false;
      }
      // iOS 13+ は許可が必要
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(function(res) {
          if (res === 'granted') {
            window.addEventListener('devicemotion', _onDeviceMotion, true);
            _motionListening = true;
            console.log('[SA] DeviceMotion permission granted (iOS)');
          } else {
            console.warn('[SA] DeviceMotion permission denied');
          }
        }).catch(function(e) {
          console.error('[SA] requestPermission error:', e);
        });
        return true; // iOS → とりあえず true（許可後に値が来る）
      }
      // Android / その他 → 直接リスナー登録
      window.addEventListener('devicemotion', _onDeviceMotion, true);
      _motionListening = true;
      console.log('[SA] DeviceMotion listener registered');
      return true;
    };

    // 最新モーション値を返す（Dart 側でポーリング）
    window.saGetMotion = function() {
      return _latestMotion;
    };

    // ── マウス/タッチ移動（PCブラウザ フォールバック）──────
    var _lastMouseX = -1, _lastMouseY = -1;
    var _mouseDelta = 0;

    document.addEventListener('mousemove', function(e) {
      if (_lastMouseX < 0) { _lastMouseX = e.clientX; _lastMouseY = e.clientY; return; }
      var dx = e.clientX - _lastMouseX, dy = e.clientY - _lastMouseY;
      _mouseDelta = Math.sqrt(dx*dx + dy*dy) * 0.3; // スケーリング
      _lastMouseX = e.clientX; _lastMouseY = e.clientY;
      // 減衰
      setTimeout(function() { _mouseDelta = _mouseDelta * 0.5; }, 150);
    });
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length < 1) return;
      var t = e.touches[0];
      if (_lastMouseX < 0) { _lastMouseX = t.clientX; _lastMouseY = t.clientY; return; }
      var dx = t.clientX - _lastMouseX, dy = t.clientY - _lastMouseY;
      _mouseDelta = Math.sqrt(dx*dx + dy*dy) * 0.3;
      _lastMouseX = t.clientX; _lastMouseY = t.clientY;
      setTimeout(function() { _mouseDelta = _mouseDelta * 0.5; }, 150);
    });

    window.saGetMouseDelta = function() {
      var d = _mouseDelta;
      _mouseDelta = 0;
      return d;
    };

    console.log('[SA] Engine v4 ready ✅');
  })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
