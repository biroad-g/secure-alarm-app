<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Secure Alarm - スマートフォン盗難防止アプリ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Secure Alarm">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Secure Alarm</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin:0; padding:0; background-color:#4A148C; overflow:hidden; }
    #loading {
      display:flex; justify-content:center; align-items:center;
      height:100vh; flex-direction:column; color:white; font-family:sans-serif;
    }
    .spinner {
      width:48px; height:48px;
      border:5px solid rgba(255,255,255,0.3);
      border-top-color:white; border-radius:50%;
      animation:spin 0.8s linear infinite; margin-bottom:16px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Secure Alarm 読み込み中...</p>
  </div>

  <script>
  // ============================================================
  //  Web Audio API - 5種類のアラーム音生成
  // ============================================================
  (function() {
    let audioCtx = null;
    let activeNodes = [];
    let isPlaying = false;

    function getAudioContext() {
      if (!audioCtx || audioCtx.state === 'closed') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function stopAll() {
      isPlaying = false;
      activeNodes.forEach(function(node) {
        try { node.stop(); } catch(e) {}
        try { node.disconnect(); } catch(e) {}
      });
      activeNodes = [];
    }

    // ---- サウンド0: 緊急サイレン（救急車風・周波数が上下）----
    function playSiren(volume) {
      var ctx = getAudioContext();
      var gainNode = ctx.createGain();
      gainNode.gain.setValueAtTime(volume * 0.8, ctx.currentTime);
      gainNode.connect(ctx.destination);

      var osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(880, ctx.currentTime + 0.5);
      osc.frequency.linearRampToValueAtTime(440, ctx.currentTime + 1.0);
      osc.frequency.linearRampToValueAtTime(880, ctx.currentTime + 1.5);
      osc.connect(gainNode);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 1.5);
      activeNodes.push(osc);
    }

    // ---- サウンド1: 電子ビープ（短いビープを連続）----
    function playBeeps(volume) {
      var ctx = getAudioContext();
      for (var i = 0; i < 5; i++) {
        (function(idx) {
          var gainNode = ctx.createGain();
          gainNode.gain.setValueAtTime(0, ctx.currentTime + idx * 0.25);
          gainNode.gain.linearRampToValueAtTime(volume * 0.9, ctx.currentTime + idx * 0.25 + 0.01);
          gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + idx * 0.25 + 0.12);
          gainNode.connect(ctx.destination);

          var osc = ctx.createOscillator();
          osc.type = 'square';
          osc.frequency.setValueAtTime(1200, ctx.currentTime + idx * 0.25);
          osc.connect(gainNode);
          osc.start(ctx.currentTime + idx * 0.25);
          osc.stop(ctx.currentTime + idx * 0.25 + 0.15);
          activeNodes.push(osc);
        })(i);
      }
    }

    // ---- サウンド2: 警告ブザー（低音の繰り返し）----
    function playBuzzer(volume) {
      var ctx = getAudioContext();
      var gainNode = ctx.createGain();
      gainNode.gain.setValueAtTime(volume * 0.9, ctx.currentTime);
      gainNode.gain.setValueAtTime(0, ctx.currentTime + 0.3);
      gainNode.gain.setValueAtTime(volume * 0.9, ctx.currentTime + 0.5);
      gainNode.gain.setValueAtTime(0, ctx.currentTime + 0.8);
      gainNode.gain.setValueAtTime(volume * 0.9, ctx.currentTime + 1.0);
      gainNode.gain.setValueAtTime(0, ctx.currentTime + 1.3);
      gainNode.connect(ctx.destination);

      var osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.connect(gainNode);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 1.4);
      activeNodes.push(osc);
    }

    // ---- サウンド3: 高音アラーム（高音の鋭い音）----
    function playHighAlarm(volume) {
      var ctx = getAudioContext();
      // 高音と中音を重ねる
      [2400, 3200].forEach(function(freq) {
        var gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(volume * 0.5, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        gainNode.connect(ctx.destination);

        var osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(freq * 1.5, ctx.currentTime + 0.6);
        osc.frequency.linearRampToValueAtTime(freq, ctx.currentTime + 1.2);
        osc.connect(gainNode);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.2);
        activeNodes.push(osc);
      });
    }

    // ---- サウンド4: 爆発的警報（複数音の重なり）----
    function playExplosiveAlarm(volume) {
      var ctx = getAudioContext();
      // 低音ベース
      var bass = ctx.createOscillator();
      var bassGain = ctx.createGain();
      bass.type = 'square';
      bass.frequency.setValueAtTime(110, ctx.currentTime);
      bassGain.gain.setValueAtTime(volume * 0.6, ctx.currentTime);
      bassGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      bass.connect(bassGain);
      bassGain.connect(ctx.destination);
      bass.start(ctx.currentTime);
      bass.stop(ctx.currentTime + 0.5);
      activeNodes.push(bass);

      // 中音ビープ
      [880, 1760, 2640].forEach(function(freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);
        gain.gain.setValueAtTime(volume * 0.5, ctx.currentTime + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.15);
        osc.stop(ctx.currentTime + i * 0.15 + 0.3);
        activeNodes.push(osc);
      });
    }

    // ---- メイン再生関数 ----
    window.secureAlarmPlay = function(soundType, volume) {
      stopAll();
      isPlaying = true;
      var vol = Math.min(1.0, Math.max(0.0, volume || 0.7));
      switch (parseInt(soundType)) {
        case 0: playSiren(vol); break;
        case 1: playBeeps(vol); break;
        case 2: playBuzzer(vol); break;
        case 3: playHighAlarm(vol); break;
        case 4: playExplosiveAlarm(vol); break;
        default: playSiren(vol);
      }
    };

    window.secureAlarmStop = function() {
      stopAll();
    };

    // ---- Flutter から呼び出すためのブリッジ ----
    // Flutter dart:js が利用できないため、CustomEventで通信
    window.addEventListener('secureAlarm', function(e) {
      var detail = e.detail || {};
      if (detail.action === 'play') {
        window.secureAlarmPlay(detail.soundType || 0, detail.volume || 0.7);
      } else if (detail.action === 'stop') {
        window.secureAlarmStop();
      }
    });

    // ---- DeviceMotion（スマホ振動検知）----
    var motionEnabled = false;
    var lastMotionTime = 0;

    window.enableDeviceMotion = function() {
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        // iOS 13+ は許可が必要
        DeviceMotionEvent.requestPermission().then(function(state) {
          if (state === 'granted') {
            motionEnabled = true;
            startMotionListener();
          }
        }).catch(console.error);
      } else {
        motionEnabled = true;
        startMotionListener();
      }
    };

    function startMotionListener() {
      window.addEventListener('devicemotion', function(e) {
        if (!motionEnabled) return;
        var acc = e.accelerationIncludingGravity;
        if (!acc) return;
        var now = Date.now();
        if (now - lastMotionTime < 100) return;
        lastMotionTime = now;
        var magnitude = Math.sqrt(
          (acc.x || 0) * (acc.x || 0) +
          (acc.y || 0) * (acc.y || 0) +
          (acc.z || 0) * (acc.z || 0)
        );
        // Flutterにモーション値を送る
        window.dispatchEvent(new CustomEvent('deviceMotionUpdate', {
          detail: { magnitude: magnitude }
        }));
      });
    }

    console.log('✅ Secure Alarm Audio Engine loaded');
  })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
