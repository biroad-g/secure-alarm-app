name: secure_alarm
description: スマートフォン盗難防止アプリ - 振動検知で段階的アラームを鳴らす
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: 4.0.2
  audioplayers: 5.2.1
  vibration: 1.9.0
  shared_preferences: 2.5.3
  provider: 6.1.5+1
  permission_handler: 11.3.1
  wakelock_plus: 1.2.8
  js: 0.6.7
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
