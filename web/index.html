<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Secure Alarm - スマートフォン盗難防止アプリ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Secure Alarm">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Secure Alarm</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin:0; padding:0; background-color:#4A148C; overflow:hidden; }
    #loading {
      display:flex; justify-content:center; align-items:center;
      height:100vh; flex-direction:column; color:white; font-family:sans-serif;
    }
    .spinner {
      width:48px; height:48px;
      border:5px solid rgba(255,255,255,0.3);
      border-top-color:white; border-radius:50%;
      animation:spin 0.8s linear infinite; margin-bottom:16px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Secure Alarm 読み込み中...</p>
  </div>

  <script>
  // ============================================================
  //  Secure Alarm - Web Audio Engine
  //  Flutter の dart:js_util から window.secureAlarmPlay/Stop を呼ぶ
  // ============================================================
  (function() {
    var _audioCtx = null;
    var _activeNodes = [];

    // AudioContext を取得（suspended なら resume）
    function _ctx() {
      if (!_audioCtx || _audioCtx.state === 'closed') {
        _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (_audioCtx.state === 'suspended') {
        _audioCtx.resume();
      }
      return _audioCtx;
    }

    // 再生中のノードをすべて停止
    function _stopAll() {
      _activeNodes.forEach(function(n) {
        try { n.stop(0); } catch(e) {}
        try { n.disconnect(); } catch(e) {}
      });
      _activeNodes = [];
    }

    // ユーティリティ：オシレータ＋ゲインを作成して接続
    function _makeOscGain(type, freq, gainVal, startTime, endTime) {
      var ctx = _ctx();
      var g = ctx.createGain();
      g.gain.setValueAtTime(gainVal, startTime);
      g.connect(ctx.destination);
      var o = ctx.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(freq, startTime);
      o.connect(g);
      o.start(startTime);
      o.stop(endTime);
      _activeNodes.push(o);
      return { osc: o, gain: g };
    }

    // ----------------------------------------------------------
    //  Sound 0: 緊急サイレン（440→880→440 のこぎり波）
    // ----------------------------------------------------------
    function _playSiren(vol) {
      var ctx = _ctx();
      var now = ctx.currentTime;
      var g = ctx.createGain();
      g.gain.setValueAtTime(vol * 0.8, now);
      g.connect(ctx.destination);
      var o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(440, now);
      o.frequency.linearRampToValueAtTime(880, now + 0.6);
      o.frequency.linearRampToValueAtTime(440, now + 1.2);
      o.frequency.linearRampToValueAtTime(880, now + 1.8);
      o.connect(g);
      o.start(now);
      o.stop(now + 1.8);
      _activeNodes.push(o);
    }

    // ----------------------------------------------------------
    //  Sound 1: 電子ビープ（1200Hz 矩形波 × 5回）
    // ----------------------------------------------------------
    function _playBeeps(vol) {
      var ctx = _ctx();
      var now = ctx.currentTime;
      for (var i = 0; i < 5; i++) {
        var t = now + i * 0.22;
        var g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.01);
        g.gain.linearRampToValueAtTime(0, t + 0.14);
        g.connect(ctx.destination);
        var o = ctx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(1200, t);
        o.connect(g);
        o.start(t);
        o.stop(t + 0.16);
        _activeNodes.push(o);
      }
    }

    // ----------------------------------------------------------
    //  Sound 2: 警告ブザー（220Hz 断続3回）
    // ----------------------------------------------------------
    function _playBuzzer(vol) {
      var ctx = _ctx();
      var now = ctx.currentTime;
      [[0, 0.28], [0.4, 0.68], [0.8, 1.08]].forEach(function(pair) {
        var t0 = now + pair[0], t1 = now + pair[1];
        var g = ctx.createGain();
        g.gain.setValueAtTime(vol * 0.9, t0);
        g.gain.setValueAtTime(0, t1);
        g.connect(ctx.destination);
        var o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(220, t0);
        o.connect(g);
        o.start(t0);
        o.stop(t1 + 0.01);
        _activeNodes.push(o);
      });
    }

    // ----------------------------------------------------------
    //  Sound 3: 高音アラーム（2400+3200Hz 上昇）
    // ----------------------------------------------------------
    function _playHighAlarm(vol) {
      var ctx = _ctx();
      var now = ctx.currentTime;
      [2400, 3200].forEach(function(freq) {
        var g = ctx.createGain();
        g.gain.setValueAtTime(vol * 0.55, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
        g.connect(ctx.destination);
        var o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, now);
        o.frequency.linearRampToValueAtTime(freq * 1.6, now + 0.7);
        o.frequency.linearRampToValueAtTime(freq, now + 1.4);
        o.connect(g);
        o.start(now);
        o.stop(now + 1.4);
        _activeNodes.push(o);
      });
    }

    // ----------------------------------------------------------
    //  Sound 4: 爆発的警報（低音ベース＋3音重ねビープ）
    // ----------------------------------------------------------
    function _playExplosive(vol) {
      var ctx = _ctx();
      var now = ctx.currentTime;
      // 低音ドン
      var bg = ctx.createGain();
      bg.gain.setValueAtTime(vol * 0.7, now);
      bg.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      bg.connect(ctx.destination);
      var bo = ctx.createOscillator();
      bo.type = 'square';
      bo.frequency.setValueAtTime(120, now);
      bo.connect(bg);
      bo.start(now);
      bo.stop(now + 0.46);
      _activeNodes.push(bo);
      // 中〜高音 3連
      [880, 1760, 2640].forEach(function(freq, i) {
        var t = now + i * 0.18;
        var g = ctx.createGain();
        g.gain.setValueAtTime(vol * 0.55, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        g.connect(ctx.destination);
        var o = ctx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(freq, t);
        o.connect(g);
        o.start(t);
        o.stop(t + 0.32);
        _activeNodes.push(o);
      });
    }

    // ----------------------------------------------------------
    //  グローバル公開関数（dart:js_util から呼ばれる）
    // ----------------------------------------------------------
    window.secureAlarmPlay = function(soundType, volume) {
      _stopAll();
      var vol = Math.min(1.0, Math.max(0.05, parseFloat(volume) || 0.7));
      var type = parseInt(soundType) || 0;
      switch (type) {
        case 0: _playSiren(vol);      break;
        case 1: _playBeeps(vol);      break;
        case 2: _playBuzzer(vol);     break;
        case 3: _playHighAlarm(vol);  break;
        case 4: _playExplosive(vol);  break;
        default: _playSiren(vol);
      }
      console.log('[SecureAlarm] play soundType=' + type + ' vol=' + vol);
    };

    window.secureAlarmStop = function() {
      _stopAll();
      console.log('[SecureAlarm] stop');
    };

    console.log('[SecureAlarm] Audio Engine ready ✅');
  })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
